name: CI

# Builds and tests every pull request ready for review, and main after each merge, so that a red
# test or a build warning (treated as an error in src/) is seen before the change is merged.
# Draft pull requests are skipped: pushes to a draft do not use runner minutes, and the CI runs
# when the draft is marked "Ready for review" (a draft cannot be merged anyway).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    # Same runner as the release: the dashboard and its folder picker target Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore LMU-DeltaRacing.slnx

      - name: Build
        run: dotnet build LMU-DeltaRacing.slnx -c Release --no-restore

      # The test project only: `dotnet test` on the solution would also run the long benchmarks.
      - name: Test
        run: dotnet test tests/LMU-DeltaRacing.Tests/LMU-DeltaRacing.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
