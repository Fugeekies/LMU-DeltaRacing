name: Build and release Windows installer (Manual)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Numéro de version (ex: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write # Requis pour créer le tag Git et publier la release automatiquement

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish self-contained dashboard
        run: dotnet publish src/LMU-DeltaRacing.UI/LMU-DeltaRacing.UI.csproj -c Release -p:PublishProfile=win-x64 -o publish_output

      - name: Validate anonymized fallback result assets
        run: pwsh -NoProfile -File scripts/Test-PackageAssets.ps1 -ResultsDirectory assets/Results

      - name: Copy committed fallback result assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish_output/TestAssets -Force | Out-Null
          Copy-Item -LiteralPath assets/Results -Destination publish_output/TestAssets -Recurse

      - name: Verify the published executable
        run: pwsh -NoProfile -File scripts/Test-PublishedApp.ps1 -PublishDirectory publish_output

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          # Récupère la version saisie manuellement (ex: v1.0.0 -> 1.0.0)
          $rawVersion = "${{ inputs.version_tag }}"
          $version = $rawVersion -replace '^v', ''
          
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "An installer version could not be determined."
          }
          iscc "/DAppVersion=$version" "scripts/installer.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LMU-DeltaRacing-Setup
          path: output/LMU-DeltaRacing-Setup.exe
          if-no-files-found: error

  release:
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LMU-DeltaRacing-Setup
          path: output

      - name: Create Git Tag Automatically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ inputs.version_tag }}
          git push origin ${{ inputs.version_tag }}
        shell: bash

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: LMU-DeltaRacing ${{ inputs.version_tag }}
          files: output/LMU-DeltaRacing-Setup.exe
          draft: false
          prerelease: false
