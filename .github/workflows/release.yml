name: Build and release Windows installer (Manual)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag et version de l’installeur (ex: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write # Requis pour créer le tag Git et publier la release automatiquement

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release inputs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "The release tag must be a semantic version such as v1.0.0."
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish self-contained dashboard
        run: dotnet publish src/LMU-DeltaRacing.UI/LMU-DeltaRacing.UI.csproj -c Release -p:PublishProfile=win-x64 -o publish_output

      - name: Copy committed fallback result assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish_output/TestAssets -Force | Out-Null
          Copy-Item -LiteralPath assets/Results -Destination publish_output/TestAssets -Recurse

      - name: Verify the published executable
        run: pwsh -NoProfile -File scripts/Test-PublishedApp.ps1 -PublishDirectory publish_output

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version_tag }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          iscc "/DAppVersion=$version" "scripts/installer.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LMU-DeltaRacing-Setup
          path: output/LMU-DeltaRacing-Setup.exe
          if-no-files-found: error

  release:
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LMU-DeltaRacing-Setup
          path: output

      - name: Create Git Tag Automatically
        env:
          RELEASE_TAG: ${{ inputs.version_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release tag must be a semantic version such as v1.0.0." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
        shell: bash

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: LMU-DeltaRacing ${{ inputs.version_tag }}
          files: output/LMU-DeltaRacing-Setup.exe
          draft: false
          prerelease: false
