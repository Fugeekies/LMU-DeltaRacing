name: Build and release Windows installer (Manual)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type de version à publier (incrémente le dernier tag vX.Y.Z)'
        required: true
        type: choice
        default: Patch
        options:
          - Majeur
          - Mineur
          - Patch

permissions:
  contents: write # Requis pour créer le tag Git et publier la release automatiquement

# Two releases started in a row would compute the same next version from the same latest tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tags and history are needed to find the latest version

      - name: Compute next version
        id: version
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
          REF: ${{ github.ref }}
        run: |
          if ($env:REF -ne 'refs/heads/main') {
            throw "Releases are published from main only (selected ref: $env:REF)."
          }

          $latest = git tag --list 'v*' --sort=-v:refname |
            Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
            Select-Object -First 1
          if ($latest) {
            $parts = $latest.TrimStart('v').Split('.') | ForEach-Object { [int]$_ }
          } else {
            $parts = 0, 0, 0
          }

          switch ($env:BUMP) {
            'Majeur' { $parts = ($parts[0] + 1), 0, 0 }
            'Mineur' { $parts = $parts[0], ($parts[1] + 1), 0 }
            'Patch'  { $parts = $parts[0], $parts[1], ($parts[2] + 1) }
            default  { throw "Unknown bump type: $env:BUMP" }
          }

          $version = $parts -join '.'
          Write-Host "Latest tag: $(if ($latest) { $latest } else { 'none' }) -> v$version ($env:BUMP)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "previous_tag=$latest" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish self-contained dashboard
        run: dotnet publish src/LMU-DeltaRacing.UI/LMU-DeltaRacing.UI.csproj -c Release -p:PublishProfile=win-x64 -o publish_output

      - name: Copy committed fallback result assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish_output/TestAssets -Force | Out-Null
          Copy-Item -LiteralPath assets/Results -Destination publish_output/TestAssets -Recurse

      - name: Verify the published executable
        run: pwsh -NoProfile -File scripts/Test-PublishedApp.ps1 -PublishDirectory publish_output

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: iscc "/DAppVersion=$env:APP_VERSION" "scripts/installer.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LMU-DeltaRacing-Setup
          path: output/LMU-DeltaRacing-Setup.exe
          if-no-files-found: error

  release:
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LMU-DeltaRacing-Setup
          path: output

      - name: Build release notes from merged pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.build-installer.outputs.previous_tag }}
          RELEASE_TAG: v${{ needs.build-installer.outputs.version }}
        run: |
          range="HEAD"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            range="$PREVIOUS_TAG..HEAD"
          fi

          # Squash merges end with "(#N)", merge commits start with "Merge pull request #N".
          # The PR title is read from GitHub so both merge styles give the same line.
          numbers=$(git log --first-parent --format=%s "$range" |
            sed -nE 's/.*\(#([0-9]+)\)$/\1/p; s/^Merge pull request #([0-9]+).*/\1/p')

          {
            echo "## Changements"
            echo
            if [[ -z "$numbers" ]]; then
              echo "Aucune PR fusionnée depuis la version précédente."
            else
              for number in $numbers; do
                gh pr view "$number" --json number,title --template '- {{.title}} (#{{.number}}){{"\n"}}'
              done
            fi
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo
              echo "**Tous les changements :** https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$RELEASE_TAG"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create Git tag
        env:
          RELEASE_TAG: v${{ needs.build-installer.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
        shell: bash

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-installer.outputs.version }}
          name: LMU-DeltaRacing v${{ needs.build-installer.outputs.version }}
          body_path: release-notes.md
          files: output/LMU-DeltaRacing-Setup.exe
          draft: false
          prerelease: false
